name: 构建

# 推送到任意分支、以及所有 PR 都编译一次，确认代码能构建通过
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: 检出源码
        uses: actions/checkout@v7

      - name: 准备 MSYS2（UCRT64）
        uses: msys2/setup-msys2@v2
        env:
          # 个别镜像在 CI 网络下会慢到 pacman 报 "Operation too slow" 整单失败，
          # 固定走官方主镜像（setup-msys2 自己的开关，去掉也能跑，只是回到镜像列表）
          __SETUP_MSYS2_USE_MAIN_MIRROR_ONLY: true
        with:
          msystem: UCRT64
          update: true

      # 升级交给上面的 action（它负责处理 msys2-runtime 自升级会杀掉当前进程的坑）；
      # 装包放这里是为了能关掉低速超时并重试，镜像抖动不再直接判构建失败
      - name: 安装 UCRT64 工具链与 Qt 6
        shell: msys2 {0}
        run: |
          sed -i '/^\[options\]/a DisableDownloadTimeout' /etc/pacman.conf
          packages=(
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-multimedia
          )
          for attempt in 1 2 3; do
            if pacman -S --noconfirm --needed --overwrite '*' "${packages[@]}"; then
              exit 0
            fi
            echo "第 $attempt 次装包失败，10 秒后重试…" >&2
            sleep 10
          done
          echo "三次装包均失败" >&2
          exit 1

      - name: 构建
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
